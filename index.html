<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B3D2E">
<meta name="apple-mobile-web-app-title" content="Caddie">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Caddie · Entrenador de swing</title>
<style>
:root{
  --bg:#0B3D2E; --bg-2:#0E4A38; --bg-3:#115540;
  --line:#F4F7F5; --text:#F4F7F5;
  --muted:rgba(244,247,245,.60); --muted-2:rgba(244,247,245,.38);
  --gold:#C9A84C; --gold-soft:rgba(201,168,76,.16);
  --red:#E0675B; --green:#5FBF8F;
  --hair:rgba(244,247,245,.12);
  --skin:#E6C3A0; --skin-d:#B98F66; --skin-s:#F2D9BF;
  --glove:#F2F4F2; --glove-d:#A9B3AC;
  --radius:14px; --tap:48px; --maxw:460px;
  font-synthesis-weight:none;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{margin:0;font-weight:500;letter-spacing:-.02em;line-height:1.25}
p{margin:0}
::selection{background:var(--gold);color:#0B3D2E}

.app{max-width:var(--maxw);margin:0 auto;min-height:100dvh;position:relative}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(11,61,46,.86);backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand-mark{width:26px;height:26px;flex:none}
.brand-name{font-size:17px;letter-spacing:-.025em;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--muted-2);letter-spacing:.09em;text-transform:uppercase;margin-top:-3px}
.icon-btn{width:var(--tap);height:var(--tap);min-width:var(--tap);display:grid;place-items:center;
  border-radius:50%;margin:-11px -12px -11px 0}
.icon-btn:active{background:rgba(255,255,255,.07)}
.icon-btn svg{width:22px;height:22px}
main{padding:0 16px 120px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:var(--maxw);margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);background:rgba(10,52,39,.93);
  backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);
  border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
.tab{min-height:var(--tap);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:9px 2px 7px;color:var(--muted-2);transition:color .18s}
.tab svg{width:21px;height:21px}
.tab span{font-size:10.5px;letter-spacing:.02em}
.tab[aria-selected="true"]{color:var(--gold)}
.tab:active{opacity:.6}

.page-head{padding:22px 0 18px}
.page-title{font-size:27px;letter-spacing:-.03em}
.page-sub{color:var(--muted);font-size:14.5px;margin-top:5px}
.sec-label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);
  margin:26px 0 10px;font-weight:500}
.hr{height:1px;background:var(--hair);border:0;margin:24px 0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);width:100%;
  border-radius:var(--radius);background:var(--gold);color:#0B3D2E;font-weight:600;
  letter-spacing:-.01em;padding:0 18px}
.btn:active{transform:scale(.985);filter:brightness(.94)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--hair)}
.btn-ghost:active{background:rgba(255,255,255,.06)}
.btn-done{background:var(--gold-soft);color:var(--gold);border:1px solid rgba(201,168,76,.4)}
.btn-sm{min-height:44px;font-size:14px;font-weight:500;border-radius:12px;padding:0 12px}
.btn svg,.btn-sm svg{width:17px;height:17px;flex:none}

.note{background:var(--gold-soft);border-left:2px solid var(--gold);padding:12px 14px;
  border-radius:0 10px 10px 0;font-size:14px;color:rgba(244,247,245,.86)}
.err{background:rgba(224,103,91,.14);border-left:2px solid var(--red);padding:12px 14px;
  border-radius:0 10px 10px 0;font-size:14px;color:#F6C9C3;word-break:break-word}

.timeline{position:relative;padding-left:40px}
.timeline::before{content:"";position:absolute;left:15px;top:14px;bottom:28px;width:1px;background:var(--hair)}
.tl-item{position:relative;display:block;width:100%;text-align:left;padding:14px 4px 18px 0;min-height:var(--tap)}
.tl-item:active{opacity:.62}
.tl-node{position:absolute;left:-40px;top:14px;width:31px;height:31px;border-radius:50%;
  display:grid;place-items:center;background:var(--bg-2);border:1px solid var(--hair);
  font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-item.done .tl-node{background:var(--gold);border-color:var(--gold);color:#0B3D2E}
.tl-item.done .tl-node svg{width:15px;height:15px}
.tl-phase{display:block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2)}
.tl-title{display:block;font-size:17.5px;margin-top:2px;letter-spacing:-.02em}
.tl-meta{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.tl-item.done .tl-title{color:var(--muted)}

.sheet{position:fixed;inset:0;z-index:70;max-width:var(--maxw);margin:0 auto;background:var(--bg);
  overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);visibility:hidden}
.sheet.open{transform:translateX(0);visibility:visible}
.sheet-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 10px;background:rgba(11,61,46,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.sheet-head h2{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{padding:0 16px 140px}
.lesson-hero{padding:20px 0 6px}
.lesson-kicker{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}
.lesson-h1{font-size:28px;letter-spacing:-.035em;margin-top:6px}
.lesson-goal{color:var(--muted);font-size:15px;margin-top:9px}

.theory{list-style:none;margin:0;padding:0;counter-reset:th}
.theory li{counter-increment:th;position:relative;padding:12px 0 12px 34px;
  border-bottom:1px solid var(--hair);font-size:15.5px}
.theory li:last-child{border-bottom:0}
.theory li::before{content:counter(th);position:absolute;left:0;top:13px;width:21px;height:21px;
  border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-size:11.5px}

.idx{margin-top:16px;border:1px solid var(--hair);border-radius:var(--radius);overflow:hidden}
.idx summary{min-height:var(--tap);display:flex;align-items:center;gap:9px;padding:0 14px;
  font-size:14.5px;color:var(--gold);cursor:pointer;list-style:none}
.idx summary::-webkit-details-marker{display:none}
.idx summary::after{content:"▾";margin-left:auto;transition:transform .2s;font-size:12px}
.idx[open] summary::after{transform:rotate(180deg)}
.idx-body{padding:2px 8px 8px}
.idx-h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);
  padding:10px 6px 4px}
.idx-i{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;
  min-height:42px;padding:7px 6px;border-radius:8px;font-size:14.5px;color:var(--text)}
.idx-i:active{background:rgba(255,255,255,.06)}
.idx-i i{font-style:normal;color:var(--muted-2);font-size:12px;min-width:20px;
  font-variant-numeric:tabular-nums}
.idx-i span{flex:1}
.idx-i em{font-style:normal;color:var(--muted-2);font-size:11.5px;white-space:nowrap}
.drill{padding:18px 0;border-top:1px solid var(--hair);scroll-margin-top:64px}
.drill-top{display:flex;align-items:baseline;gap:10px}
.drill-name{font-size:17px;letter-spacing:-.02em;flex:1}
.drill-reps{font-size:11.5px;color:var(--gold);white-space:nowrap;background:var(--gold-soft);
  padding:3px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.drill-cue{font-size:14.5px;color:rgba(244,247,245,.80);margin-top:8px;padding-left:12px;
  border-left:2px solid var(--hair)}
.drill-cue b{color:var(--gold);font-weight:500}
.mistakes{list-style:none;margin:0;padding:0}
.mistakes li{display:flex;gap:10px;padding:10px 0;font-size:15px;border-bottom:1px solid var(--hair);
  color:rgba(244,247,245,.86)}
.mistakes li:last-child{border-bottom:0}
.mistakes li::before{content:"✕";color:var(--red);font-size:13px;line-height:1.75;flex:none}

/* --- animaciones --- */
.animwrap{margin-top:14px}
.animbox{--spd:1;background:linear-gradient(180deg,#0d4535 0%,#0a3b2d 100%);
  border:1px solid var(--hair);border-radius:var(--radius);overflow:hidden}
.animbox svg{display:block;width:100%;height:auto}
.animctl{display:flex;align-items:center;gap:8px;margin-top:8px}
.ictl{min-height:38px;padding:0 13px;border-radius:99px;border:1px solid var(--hair);
  font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ictl:active{background:rgba(255,255,255,.07)}
.ictl[data-spd]{font-variant-numeric:tabular-nums;min-width:52px;justify-content:center}
.animlabel{font-size:12px;color:var(--muted-2);flex:1;text-align:right;line-height:1.3}
.animbox text{font-family:inherit;letter-spacing:.03em}
.animbox .ov-g{fill:var(--gold);font-size:11px;font-weight:600}
.animbox .ov-t{fill:rgba(244,247,245,.62);font-size:10.5px}

/* --- verificación por ejercicio --- */
.dcheck{margin-top:12px;border:1px solid var(--hair);border-radius:var(--radius);
  padding:12px;background:rgba(0,0,0,.14)}
.dcheck-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gold);
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.dcheck-h svg{width:15px;height:15px}
.dcheck-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.strip{display:flex;gap:6px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.strip img{height:74px;width:auto;border-radius:8px;border:1px solid var(--hair);flex:none;background:#000}
.verdict{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:12px;
  margin-top:10px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.verdict.v-ok{background:rgba(95,191,143,.16);color:#8FE0B6}
.verdict.v-mid{background:var(--gold-soft);color:var(--gold)}
.verdict.v-bad{background:rgba(224,103,91,.16);color:#F3A79D}
.verdict .vdot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}

.fb-sec{background:rgba(244,247,245,.055);border-radius:var(--radius);padding:14px 15px;
  margin-top:10px;border-left:2px solid var(--hair)}
.fb-sec.ok{border-left-color:var(--green)}
.fb-sec.warn{border-left-color:var(--red)}
.fb-sec.fix{border-left-color:var(--gold)}
.fb-sec.info{border-left-color:rgba(244,247,245,.35)}
.fb-sec h4{font-size:13px;letter-spacing:.04em;margin-bottom:7px}
.fb-sec.ok h4{color:#7ED6A8}.fb-sec.warn h4{color:#F09A90}
.fb-sec.fix h4{color:var(--gold)}.fb-sec.info h4{color:var(--muted)}
.fb-sec .body{font-size:14.5px;color:rgba(244,247,245,.88)}
.fb-sec .body ul{margin:6px 0 0;padding-left:17px}
.fb-sec .body li{margin-bottom:5px}
.fb-sec .body p+p{margin-top:7px}
.fb-sec .body b{color:var(--text);font-weight:600}

/* --- chat --- */
.fab{position:fixed;z-index:75;right:calc(50% - min(50vw,var(--maxw)/2) + 16px);
  bottom:calc(22px + env(safe-area-inset-bottom));min-height:52px;padding:0 20px 0 16px;
  display:flex;align-items:center;gap:9px;background:var(--gold);color:#0B3D2E;border-radius:99px;
  font-weight:600;font-size:14.5px;box-shadow:0 8px 26px rgba(0,0,0,.42);
  visibility:hidden;opacity:0;transform:translateY(12px);
  transition:opacity .22s,transform .22s,visibility .22s}
.fab.show{visibility:visible;opacity:1;transform:translateY(0)}
.fab:active{transform:scale(.96)}
.fab svg{width:19px;height:19px}
.chat{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:var(--maxw);margin:0 auto;
  height:88dvh;display:flex;flex-direction:column;background:var(--bg-2);border-radius:20px 20px 0 0;
  border-top:1px solid var(--hair);box-shadow:0 -18px 44px rgba(0,0,0,.5);transform:translateY(102%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);visibility:hidden}
.chat.open{transform:translateY(0);visibility:visible}
.chat-grab{width:38px;height:4px;border-radius:99px;background:var(--hair);margin:9px auto 2px}
.chat-head{display:flex;align-items:center;gap:10px;padding:6px 14px 12px;border-bottom:1px solid var(--hair)}
.chat-head .ch-t{flex:1;min-width:0}
.chat-head h3{font-size:15.5px}
.chat-head p{font-size:11.5px;color:var(--muted-2);letter-spacing:.05em;text-transform:uppercase}
.chat-log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.msg{margin-bottom:14px;font-size:15px}
.msg.u{display:flex;justify-content:flex-end}
.msg.u div{background:var(--gold);color:#0B3D2E;padding:9px 14px;border-radius:16px 16px 4px 16px;
  max-width:84%;white-space:pre-wrap;word-break:break-word}
.msg.a div{background:rgba(244,247,245,.07);border-left:2px solid var(--gold);padding:11px 14px;
  border-radius:0 12px 12px 0;color:rgba(244,247,245,.93)}
.msg.a div b{color:var(--gold);font-weight:600}
.msg.a div ul{margin:7px 0 0;padding-left:18px}
.msg.a div li{margin-bottom:4px}
.msg.a div p+p{margin-top:8px}
.chat-foot{display:flex;gap:9px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--hair)}
.chat-foot textarea{flex:1;background:rgba(0,0,0,.22);border:1px solid var(--hair);border-radius:20px;
  padding:11px 14px;resize:none;max-height:110px;font-size:16px;line-height:1.4}
.chat-foot textarea:focus{outline:none;border-color:rgba(201,168,76,.55)}
.send{width:var(--tap);height:var(--tap);min-width:var(--tap);border-radius:50%;background:var(--gold);
  color:#0B3D2E;display:grid;place-items:center}
.send svg{width:20px;height:20px}
.send[disabled]{opacity:.4}
.typing{display:flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* --- analizador --- */
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;width:100%;
  min-height:150px;border:1px dashed rgba(201,168,76,.45);border-radius:var(--radius);
  background:var(--gold-soft);color:var(--gold);padding:18px;text-align:center}
.upload:active{filter:brightness(1.15)}
.upload svg{width:28px;height:28px}
.upload b{font-size:15.5px;font-weight:600}
.upload span{font-size:12.5px;color:var(--muted);max-width:250px;line-height:1.45}
.ta{width:100%;min-height:170px;resize:vertical;background:rgba(0,0,0,.22);border:1px solid var(--hair);
  border-radius:var(--radius);padding:13px 14px;font-size:15px;line-height:1.55}
.ta:focus{outline:none;border-color:rgba(201,168,76,.55)}

/* --- progreso --- */
.ring-wrap{display:flex;align-items:center;gap:20px;padding:6px 0 4px}
.ring{width:108px;height:108px;flex:none}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bgc{stroke:rgba(244,247,245,.10)}
.ring .fgc{stroke:var(--gold);transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1)}
.ring-num{font-size:25px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring-lab{font-size:13.5px;color:var(--muted);margin-top:2px}
.pg-row{display:flex;align-items:center;gap:13px;min-height:var(--tap);padding:11px 0;
  border-bottom:1px solid var(--hair);width:100%;text-align:left}
.pg-check{width:25px;height:25px;flex:none;border-radius:50%;border:1px solid var(--hair);
  display:grid;place-items:center}
.pg-row.done .pg-check{background:var(--gold);border-color:var(--gold)}
.pg-row.done .pg-check svg{width:13px;height:13px;color:#0B3D2E}
.pg-name{flex:1;font-size:15.5px}
.pg-row.done .pg-name{color:var(--muted)}
.pg-n{font-size:12px;color:var(--muted-2);font-variant-numeric:tabular-nums}

/* --- modal --- */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .24s,visibility .24s}
.modal.open{opacity:1;visibility:visible}
.modal-card{width:100%;max-width:var(--maxw);background:var(--bg-2);border-radius:20px 20px 0 0;
  border-top:1px solid var(--hair);padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(20px);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:92dvh;overflow-y:auto}
.modal.open .modal-card{transform:translateY(0)}
.field{margin-top:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
.field input{width:100%;min-height:var(--tap);background:rgba(0,0,0,.24);border:1px solid var(--hair);
  border-radius:12px;padding:0 14px;font-size:16px}
.field input:focus{outline:none;border-color:rgba(201,168,76,.55)}
.field small{display:block;font-size:12px;color:var(--muted-2);margin-top:6px;line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .sheet,.chat,.modal-card,.fab{transition:none !important}
  .typing i{animation:none}
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="9" r="6.2" stroke="#C9A84C" stroke-width="2"/>
        <circle cx="13.6" cy="7.4" r="1" fill="#C9A84C"/><circle cx="18" cy="7.4" r="1" fill="#C9A84C"/>
        <circle cx="15.8" cy="11" r="1" fill="#C9A84C"/>
        <path d="M16 15.2V27" stroke="#F4F7F5" stroke-width="2" stroke-linecap="round"/>
        <path d="M11 27h10" stroke="#F4F7F5" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div><div class="brand-name">Caddie</div><div class="brand-sub">Entrenador de swing</div></div>
    </div>

/* ===================================================================
   MOTOR 3D — esqueleto con cinemática inversa, cámara en perspectiva
   =================================================================== */
const NS = "http://www.w3.org/2000/svg";
const RAD = Math.PI/180;
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function E(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
const A = (e,k,v) => e.setAttribute(k,v);

/* --- vectores --- */
const v3  = (x,y,z) => ({x,y,z});
const add = (a,b) => v3(a.x+b.x, a.y+b.y, a.z+b.z);
const sub = (a,b) => v3(a.x-b.x, a.y-b.y, a.z-b.z);
const mul = (a,k) => v3(a.x*k, a.y*k, a.z*k);
const dot = (a,b) => a.x*b.x + a.y*b.y + a.z*b.z;
const len = a => Math.hypot(a.x,a.y,a.z);
const nrm = a => { const l = len(a)||1; return mul(a,1/l); };
const lerp3 = (a,b,u) => v3(a.x+(b.x-a.x)*u, a.y+(b.y-a.y)*u, a.z+(b.z-a.z)*u);
const rX = (p,a) => { const c=Math.cos(a), s=Math.sin(a); return v3(p.x, p.y*c-p.z*s, p.y*s+p.z*c); };
const rY = (p,a) => { const c=Math.cos(a), s=Math.sin(a); return v3(p.x*c+p.z*s, p.y, -p.x*s+p.z*c); };
const rZ = (p,a) => { const c=Math.cos(a), s=Math.sin(a); return v3(p.x*c-p.y*s, p.x*s+p.y*c, p.z); };

/* --- cámara en perspectiva --- */
function mkCam(o){
  const az=(o.az||0)*RAD, el=(o.el||0)*RAD;
  const dist=o.dist||300, fov=o.fov||262;
  const cx=o.cx!==undefined?o.cx:170, cy=o.cy!==undefined?o.cy:116;
  const piv=o.pivot||v3(0,95,-30);
  return p => {
    let q = sub(p,piv); q = rY(q,az); q = rX(q,el);
    const z = q.z + dist, k = fov/Math.max(z,50);
    return {x: cx + q.x*k, y: cy - q.y*k, k, z};
  };
}

/* --- cinemática inversa de dos huesos --- */
function ik2(root, end, l1, l2, pole){
  const d = sub(end,root);
  const raw = len(d) || 0.001;
  const L = Math.min(Math.max(raw, 0.5), l1+l2-0.4);
  const u = mul(d, 1/raw);
  const x = (L*L + l1*l1 - l2*l2) / (2*L);
  const y = Math.sqrt(Math.max(0, l1*l1 - x*x));
  let p = sub(pole, root);
  p = sub(p, mul(u, dot(p,u)));
  if(len(p) < 0.01) p = v3(0,-1,0);
  return add(root, add(mul(u,x), mul(nrm(p), y)));
}

/* --- proporciones del golfista (cm) --- */
const B = {
  pelY:93, pelZ:-56, spine:44, hub:56, neck:62, head:75,
  sh:21, hip:12, upper:31, fore:29, thigh:43, shin:41, foot:27,
  handR:70, handInc:12*RAD, shaftInc:31*RAD, clubL:85
};

/* --- claves de pose del swing completo --- */
const SK = [
  {t:0.000, phi:  -4, pel:  0, ch:   0, hi:30, ti:-3, sw: 0, co:   0, wt:.50, fd:1},
  {t:0.090, phi:  -4, pel:  0, ch:   0, hi:30, ti:-3, sw: 0, co:   0, wt:.50, fd:1},

  {t:0.280, phi:-106, pel:-24, ch: -64, hi:29, ti:-5, sw:-4, co: -82, wt:.37, fd:1},
  {t:0.380, phi:-152, pel:-37, ch: -90, hi:28, ti:-7, sw:-4, co:-108, wt:.34, fd:1},
  {t:0.430, phi:-158, pel:-40, ch: -94, hi:28, ti:-7, sw:-3, co:-112, wt:.36, fd:1},
  {t:0.470, phi:-150, pel:-16, ch: -88, hi:29, ti:-9, sw: 2, co:-110, wt:.55, fd:1},
  {t:0.520, phi: -98, pel:  6, ch: -58, hi:30, ti:-12,sw: 5, co: -97, wt:.72, fd:1},
  {t:0.560, phi: -40, pel: 28, ch: -26, hi:31, ti:-13,sw: 6, co: -54, wt:.82, fd:1},
  {t:0.595, phi:  11, pel: 42, ch:  -4, hi:30, ti:-11,sw: 7, co: -14, wt:.88, fd:1},
  {t:0.650, phi:  52, pel: 56, ch:  28, hi:27, ti: -7,sw: 8, co:  24, wt:.93, fd:1},
  {t:0.730, phi: 110, pel: 72, ch:  64, hi:19, ti:  0,sw: 9, co:  84, wt:.96, fd:1},
  {t:0.820, phi: 158, pel: 85, ch:  97, hi: 7, ti:  7,sw:10, co: 116, wt:.98, fd:1},
  {t:0.920, phi: 162, pel: 87, ch:  99, hi: 6, ti:  8,sw:10, co: 118, wt:.98, fd:1},
  {t:0.960, phi: 162, pel: 87, ch:  99, hi: 6, ti:  8,sw:10, co: 118, wt:.98, fd:.25},
  {t:1.000, phi:  -4, pel:  0, ch:   0, hi:30, ti:-3, sw: 0, co:   0, wt:.50, fd:.25}
];
const PK = ["phi","pel","ch","hi","ti","sw","co","wt","fd"];

function poseAt(t){
  t = ((t % 1) + 1) % 1;
  let i = 0;
  while(i < SK.length-2 && t > SK[i+1].t) i++;
  const a = SK[i], b = SK[i+1];
  let u = (t - a.t) / ((b.t - a.t) || 1);
  u = Math.max(0, Math.min(1, u));
  const e = u*u*(3-2*u);
  const o = {};
  for(const k of PK) o[k] = a[k] + (b[k]-a[k])*e;
  return o;
}

/* --- construcción del cuerpo en coordenadas de mundo --- */
function buildBody(P, opt){
  opt = opt || {};
  const hi = P.hi*RAD, ti = P.ti*RAD;
  const axis = rZ(rX(v3(0,1,0), hi), ti);
  const T = turn => p => rZ(rX(rY(p, turn*RAD), hi), ti);
  const Tp = T(P.pel), Tc = T(P.ch);

  const pelvis = v3(P.sw, B.pelY, B.pelZ - 16*Math.sin(hi));
  const chest  = add(pelvis, mul(axis, B.spine));
  const hub    = add(pelvis, mul(axis, B.hub));
  const neck   = add(pelvis, mul(axis, B.neck));
  const head   = add(pelvis, mul(axis, B.head));

  const shL = add(chest,  Tc(v3( B.sh, 2, 0)));
  const shR = add(chest,  Tc(v3(-B.sh, 2, 0)));
  const hipL= add(pelvis, Tp(v3( B.hip, 0, 0)));
  const hipR= add(pelvis, Tp(v3(-B.hip, 0, 0)));

  const scale = opt.phiScale || 1;
  const phi = P.phi * scale * RAD;
  const co  = P.co  * scale;
  let h = v3(B.handR*Math.sin(phi), -B.handR*Math.cos(phi), 0);
  h = rX(h, -B.handInc);
  const hands = add(hub, h);

  const th = (P.phi*scale + co) * RAD;
  let s = rX(v3(Math.sin(th), -Math.cos(th), 0), -B.shaftInc);
  const clubL = opt.clubL || B.clubL;
  const chead = add(hands, mul(s, clubL));

  const pole = add(hands, v3(0,-46,34));
  const elbL = ik2(shL, hands, B.upper, B.fore, pole);
  const elbR = ik2(shR, hands, B.upper, B.fore, pole);

  const stance = opt.stance !== undefined ? opt.stance : B.foot;
  const ankL = v3( stance, 9, B.pelZ), ankR = v3(-stance, 9, B.pelZ);
  const heel = Math.max(0, (P.wt - .72)) * 3.2;
  const ankR2 = v3(ankR.x, ankR.y + heel*4, ankR.z - heel*2);
  const kneeL = ik2(hipL, ankL,  B.thigh, B.shin, add(hipL, v3( 4,-24,40)));
  const kneeR = ik2(hipR, ankR2, B.thigh, B.shin, add(hipR, v3(-4,-24,40)));

  return {pelvis,chest,hub,neck,head,shL,shR,hipL,hipR,hands,chead,elbL,elbR,
          ankL,ankR:ankR2,kneeL,kneeR,axis,Tc,Tp,heel,P,shaftDir:s};
}

/* --- utilidades de dibujo --- */
function poly(pts){ return pts.map(p => p.x.toFixed(1)+","+p.y.toFixed(1)).join(" "); }
function limb(outline, fill, pts, w){
  const d = poly(pts);
  A(outline,"points",d); A(fill,"points",d);
  A(outline,"stroke-width",(w+3).toFixed(1));
  A(fill,"stroke-width",w.toFixed(1));
}

    const neckEl = mk(gFig,"#E6EDE8");
    const armR = mk(gFig,"#C9D6CE"), armL = mk(gFig,"#F2F6F3");
    const headEl = E("ellipse",{fill:"#EFF4F1",stroke:"#06251b","stroke-width":2},gFig);
    const capEl  = E("path",{fill:"var(--gold)",opacity:.92},gFig);
    const shoeL = E("ellipse",{fill:"#D8E2DB",stroke:"#06251b","stroke-width":1.5},gFig);
    const shoeR = E("ellipse",{fill:"#B9C8BF",stroke:"#06251b","stroke-width":1.5},gFig);
    const gloveEl = E("circle",{fill:"var(--glove)",stroke:"#06251b","stroke-width":1.5},gFig);

    /* palo */
    const shaftO = E("line",{stroke:"#06251b","stroke-width":5,"stroke-linecap":"round"},gClub);
    const shaftF = E("line",{stroke:"#EDEFF0","stroke-width":2.6,"stroke-linecap":"round"},gClub);
    const headCl = E("polygon",{fill:"#DDE3E6",stroke:"#06251b","stroke-width":1.4,
      "stroke-linejoin":"round"},gClub);

    const ov = buildOverlay(opt.overlay, gOver, gUI, VW, VH);

    const cam = mkCam(Object.assign({pivot:v3(0,124,-40)}, opt.cam||{}));
    const trail = [];
    let lastT = -9, ballPos = null;

    function draw(tt){
      const t = mapPhase(tt, opt);
      const P = poseAt(t);
      if(opt.poseHinge){
        const u = pp(tt);
        P.hi = 2 + u*30; P.phi = -4 + u*0; P.pel=0; P.ch=0;
        P.ti = -3*u; P.sw = 0; P.co = u*6; P.wt = .5; P.fd = 1;
      }
      if(opt.clampPhi){
        const c = opt.clampPhi;
        P.phi = Math.max(-c, Math.min(c, P.phi));
        P.co  = Math.max(-c*0.8, Math.min(c*0.8, P.co));
      }
      const b = buildBody(P, opt);
      const p = cam;

      if(!ballPos){
        const a0 = buildBody(poseAt(0), opt);
        ballPos = v3(a0.chead.x, 2.2, a0.chead.z);
      }

      /* suelo */
      const zs = [ballPos.z, ballPos.z-26, ballPos.z-52, B.pelZ-8, B.pelZ-30];
      groundLines.forEach((l,i)=>{
        const a = p(v3(-150,0,zs[i])), c = p(v3(150,0,zs[i]));
        A(l,"x1",a.x); A(l,"y1",a.y); A(l,"x2",c.x); A(l,"y2",c.y);
        A(l,"stroke", i===0 ? "rgba(201,168,76,.38)" : "rgba(244,247,245,.10)");
        A(l,"stroke-width", i===0 ? 1.6 : 1);
      });
      const bp = p(ballPos);
      A(ball,"cx",bp.x); A(ball,"cy",bp.y); A(ball,"r",(3.1*bp.k).toFixed(1));
      A(ball,"opacity", opt.noBall ? 0 : 1);
      const sp = p(v3(b.pelvis.x,0,B.pelZ));
      A(shadow,"cx",sp.x); A(shadow,"cy",sp.y);
      A(shadow,"rx",(34*sp.k).toFixed(1)); A(shadow,"ry",(7*sp.k).toFixed(1));

      /* estela */
      if(Math.abs(t-lastT) > .25) trail.length = 0;
      lastT = t;
      if(opt.trail !== false){
        trail.push(p(b.chead));
        if(trail.length > 26) trail.shift();
        A(trailEl,"points", poly(trail));
        A(trailEl,"opacity", trail.length>4 ? .5 : 0);
      }

      /* profundidad: dibuja primero el lado lejano */
      const farTrail = p(b.shR).z > p(b.shL).z;
      gFig.insertBefore(farTrail ? armL.o : armR.o, gFig.firstChild);

      /* piernas */
      const kL=p(b.kneeL), kR=p(b.kneeR), aL=p(b.ankL), aR=p(b.ankR);
      const hL=p(b.hipL), hR=p(b.hipR);
      limb(legR.o, legR.f, [hR,kR,aR], 10.6*hR.k);
      limb(legL.o, legL.f, [hL,kL,aL], 10.6*hL.k);
      [[shoeR,aR,b.heel],[shoeL,aL,0]].forEach(([el,a,h])=>{
        A(el,"cx",a.x); A(el,"cy",a.y+2*a.k);
        A(el,"rx",(9*a.k).toFixed(1)); A(el,"ry",(4.6*a.k).toFixed(1));
        A(el,"transform",`rotate(${(-h*9).toFixed(1)} ${a.x} ${a.y})`);
      });

      /* torso */
      const sL=p(b.shL), sR=p(b.shR);
      A(torso,"points", poly([sL,sR,hR,hL]));
      A(torso,"stroke-width",(2.4*sL.k).toFixed(1));
      const nk=p(b.neck), hd=p(b.head);
      limb(neckEl.o, neckEl.f, [p(b.chest),nk], 11*nk.k);

      /* brazos */
      const eL=p(b.elbL), eR=p(b.elbR), hn=p(b.hands);
      limb(armR.o, armR.f, [sR,eR,hn], 8.1*hn.k);
      limb(armL.o, armL.f, [sL,eL,hn], 8.1*hn.k);
      if(opt.arm === "trail"){ A(armL.o,"opacity",.12); A(armL.f,"opacity",.12); }
      else { A(armL.o,"opacity",1); A(armL.f,"opacity",1); }
      A(gloveEl,"cx",hn.x); A(gloveEl,"cy",hn.y); A(gloveEl,"r",(6*hn.k).toFixed(1));

      /* cabeza */
      A(headEl,"cx",hd.x); A(headEl,"cy",hd.y);
      A(headEl,"rx",(9.3*hd.k).toFixed(1)); A(headEl,"ry",(10.6*hd.k).toFixed(1));
      const face = p(add(b.head, rZ(rX(rY(v3(0,0,12), b.P.ch*RAD), b.P.hi*RAD), b.P.ti*RAD)));
      const dx = face.x-hd.x, dy = face.y-hd.y, dl = Math.hypot(dx,dy)||1;
      const rr = 10.4*hd.k;
      A(capEl,"d",`M ${hd.x-rr*0.98} ${hd.y-rr*0.22} A ${rr} ${rr} 0 0 1 ${hd.x+rr*0.98} ${hd.y-rr*0.22} `+
        `L ${hd.x+dx/dl*rr*1.5} ${hd.y+dy/dl*rr*0.5} L ${hd.x-rr*0.98} ${hd.y-rr*0.22} Z`);

      /* palo */
      const ch=p(b.chead);
      [[shaftO,5.2],[shaftF,2.6]].forEach(([el,w])=>{
        A(el,"x1",hn.x); A(el,"y1",hn.y); A(el,"x2",ch.x); A(el,"y2",ch.y);
        A(el,"stroke-width",(w*ch.k).toFixed(1));
      });
      const sd = Math.atan2(ch.y-hn.y, ch.x-hn.x);
      const px = Math.cos(sd+Math.PI/2), py = Math.sin(sd+Math.PI/2);
      const hw = 9.5*ch.k, hh = 4.2*ch.k;
      A(headCl,"points",
        `${(ch.x-px*hw).toFixed(1)},${(ch.y-py*hw).toFixed(1)} `+
        `${(ch.x+px*hw).toFixed(1)},${(ch.y+py*hw).toFixed(1)} `+
        `${(ch.x+px*hw+Math.cos(sd)*hh).toFixed(1)},${(ch.y+py*hw+Math.sin(sd)*hh).toFixed(1)} `+
        `${(ch.x-px*hw+Math.cos(sd)*hh).toFixed(1)},${(ch.y-py*hw+Math.sin(sd)*hh).toFixed(1)}`);

      gFig.style.opacity = P.fd.toFixed(2);
      gClub.style.opacity = P.fd.toFixed(2);
      if(ov) ov(b, p, t, P, ballPos);
    }

    return {host, dur: opt.dur || 5.4, draw};
  };
}

function mapPhase(t, o){
  const r = o.range || [0,1];
  if(o.pingpong){
    const u = t < .5 ? t*2 : (1-t)*2;
    const e = u*u*(3-2*u);
    return r[0] + e*(r[1]-r[0]);
  }
  return r[0] + t*(r[1]-r[0]);
}
/* ===================================================================
   CAPAS DE DATOS SOBRE LA ANIMACIÓN
   =================================================================== */
function buildOverlay(kind, g, ui, VW, VH){
  if(!kind) return null;
  const txt = (x,y,cls,anchor) => E("text",{x,y,class:cls||"ov-t",
    "text-anchor":anchor||"start"},ui);

  if(kind === "plane"){
    const pl = E("polygon",{fill:"rgba(201,168,76,.09)",stroke:"var(--gold)",
      "stroke-width":1.2,"stroke-dasharray":"4 4"},g);
    const t1 = txt(10,18,"ov-g");
    return (b,p)=>{
      const pts=[];
      for(let i=0;i<=40;i++){
        const a = (-200 + i*(360/40))*RAD;
        let s = rX(v3(Math.sin(a),-Math.cos(a),0), -B.shaftInc);
        pts.push(p(add(b.hub, mul(s, (B.handR + B.clubL)*0.92))));
      }
      A(pl,"points",poly(pts));
      t1.textContent = "Plano del palo";
    };
  }

  if(kind === "turn"){
    const sl = E("line",{stroke:"var(--gold)","stroke-width":2.6,"stroke-linecap":"round"},g);
    const hl = E("line",{stroke:"rgba(244,247,245,.75)","stroke-width":2.2,"stroke-linecap":"round"},g);
    const d1 = E("circle",{fill:"var(--gold)"},g), d2 = E("circle",{fill:"var(--gold)"},g);
    const t1 = txt(10,18,"ov-g"), t2 = txt(10,33,"ov-t");
    return (b,p,t,P)=>{
      const a=p(b.shL), c=p(b.shR);
      A(sl,"x1",a.x);A(sl,"y1",a.y);A(sl,"x2",c.x);A(sl,"y2",c.y);
      A(d1,"cx",a.x);A(d1,"cy",a.y);A(d1,"r",3.2*a.k);
      A(d2,"cx",c.x);A(d2,"cy",c.y);A(d2,"r",3.2*c.k);
      const e=p(b.hipL), f=p(b.hipR);
      A(hl,"x1",e.x);A(hl,"y1",e.y);A(hl,"x2",f.x);A(hl,"y2",f.y);
      t1.textContent = "Hombros " + Math.round(Math.abs(P.ch)) + "°";
      t2.textContent = "Caderas " + Math.round(Math.abs(P.pel)) + "°";
    };
  }

  if(kind === "triangle"){
    const tri = E("polygon",{fill:"rgba(201,168,76,.17)",stroke:"var(--gold)",
      "stroke-width":1.8,"stroke-linejoin":"round"},g);
    const t1 = txt(10,18,"ov-g");
    return (b,p)=>{
      A(tri,"points", poly([p(b.shL),p(b.shR),p(b.hands)]));
      t1.textContent = "Triángulo en bloque";
    };
  }

  if(kind === "pressure"){
    const c1 = E("ellipse",{fill:"rgba(201,168,76,.30)"},g);
    const c2 = E("ellipse",{fill:"rgba(201,168,76,.30)"},g);
    const bar = E("rect",{fill:"rgba(244,247,245,.10)",rx:4},ui);
    const fil = E("rect",{fill:"var(--gold)",rx:4},ui);
    A(bar,"x",VW-130); A(bar,"y",VH-20); A(bar,"width",118); A(bar,"height",7);
    A(fil,"y",VH-20); A(fil,"height",7);
    const t1 = txt(10,18,"ov-g");
    const t2 = txt(VW-12,VH-26,"ov-t","end");
    return (b,p,t,P)=>{
      const a=p(b.ankL), c=p(b.ankR);
      const wl = P.wt, wr = 1-P.wt;
      A(c1,"cx",a.x);A(c1,"cy",a.y+3*a.k);A(c1,"rx",(7+16*wl)*a.k);A(c1,"ry",(3+6*wl)*a.k);
      A(c2,"cx",c.x);A(c2,"cy",c.y+3*c.k);A(c2,"rx",(7+16*wr)*c.k);A(c2,"ry",(3+6*wr)*c.k);
      A(fil,"x",VW-130); A(fil,"width",(118*wl).toFixed(1));
      t1.textContent = "Presión en el pie";
      t2.textContent = Math.round(wr*100)+" / "+Math.round(wl*100);
    };
  }

  if(kind === "lean"){
    const vl = E("line",{stroke:"rgba(244,247,245,.4)","stroke-width":1.3,
      "stroke-dasharray":"4 4"},g);
    const ex = E("line",{stroke:"var(--gold)","stroke-width":1.4,"stroke-dasharray":"3 4"},g);
    const t1 = txt(10,18,"ov-g"), t2 = txt(10,33,"ov-t");
    return (b,p,t,P,ball)=>{
      const a=p(ball), c=p(v3(ball.x,120,ball.z));
      A(vl,"x1",a.x);A(vl,"y1",a.y);A(vl,"x2",c.x);A(vl,"y2",c.y);
      const h=p(b.hands), ch=p(b.chead);
      const ux=h.x-ch.x, uy=h.y-ch.y, ul=Math.hypot(ux,uy)||1;
      A(ex,"x1",ch.x);A(ex,"y1",ch.y);
      A(ex,"x2",ch.x+ux/ul*150);A(ex,"y2",ch.y+uy/ul*150);
      const lean = Math.round(Math.atan2(b.hands.x-b.chead.x, b.hands.y-b.chead.y)/RAD);
      t1.textContent = "Inclinación del shaft";
      t2.textContent = lean>1 ? lean+"° hacia el objetivo"
        : lean<-1 ? Math.abs(lean)+"° hacia atrás · flipping" : "shaft vertical";
      A(t1,"fill", lean>4 ? "var(--green)" : "var(--gold)");
    };
  }

  if(kind === "lowpoint"){
    const arc = E("polyline",{fill:"none",stroke:"rgba(201,168,76,.45)",
      "stroke-width":1.4,"stroke-dasharray":"3 4"},g);
    const dv = E("path",{stroke:"var(--gold)","stroke-width":5,fill:"none",
      "stroke-linecap":"round",opacity:0},g);
    const mk = E("line",{stroke:"var(--green)","stroke-width":1.6,"stroke-dasharray":"3 3"},g);
    const t1 = txt(10,18,"ov-g"), t2 = txt(10,33,"ov-t");
    return (b,p,t,P,ball)=>{
      const pts=[]; let low3=null;
      for(let i=0;i<=30;i++){
        const w = buildBody(poseAt(0.50 + (i/30)*0.16)).chead;
        if(!low3 || w.y < low3.y) low3 = w;
        pts.push(p(w));
      }
      A(arc,"points",poly(pts));
      let low = pts[0];
      pts.forEach(q=>{ if(q.y>low.y) low=q; });
      A(mk,"x1",low.x);A(mk,"y1",low.y-26);A(mk,"x2",low.x);A(mk,"y2",low.y+8);
      const a=p(ball);
      A(dv,"d",`M ${low.x-6} ${low.y+1} q 14 7 30 1`);
      A(dv,"opacity", t>0.60 ? Math.min(1,(t-0.60)*8) : 0);
      const d3 = Math.round(low3.x - ball.x);
      t1.textContent = "Punto bajo por delante";
      t2.textContent = (d3>=0 ? "la chuleta empieza por delante de la bola" : "cae por detrás · golpe gordo");
      A(t1,"fill", d3>=0 ? "var(--green)" : "var(--red)");
    };
  }

  if(kind === "wrist"){
    const arc = E("path",{fill:"none",stroke:"var(--gold)","stroke-width":1.6},g);
    const t1 = txt(10,18,"ov-g"), t2 = txt(10,33,"ov-t");
    return (b,p,t,P)=>{
      const h=p(b.hands), e=p(b.elbL), c=p(b.chead);
      const fa=nrm(sub(b.hands,b.elbL)), sh=nrm(sub(b.chead,b.hands));
      const inc=180-Math.acos(Math.max(-1,Math.min(1,dot(fa,sh))))*180/Math.PI;
      const a1=Math.atan2(e.y-h.y,e.x-h.x), a2=Math.atan2(c.y-h.y,c.x-h.x);
      const r=22;
      const x1=h.x+Math.cos(a1)*r, y1=h.y+Math.sin(a1)*r;
      const x2=h.x+Math.cos(a2)*r, y2=h.y+Math.sin(a2)*r;
      let d=(a2-a1)*180/Math.PI; while(d<-180)d+=360; while(d>180)d-=360;
      A(arc,"d",`M ${x1} ${y1} A ${r} ${r} 0 0 ${d>0?1:0} ${x2} ${y2}`);
      t1.textContent = "Ángulo antebrazo-palo";
      t2.textContent = Math.round(inc) + "°" + (inc<105 ? "  · set completo" : "");
    };
  }

  if(kind === "bars"){
    const names=["Cadera","Torso","Brazos","Palo"];
    const rows = names.map((n,i)=>{
      const y = 14 + i*17;
      E("text",{x:10,y:y+8,class:"ov-t"},ui).textContent = n;
      const bg = E("rect",{x:66,y:y,width:92,height:11,rx:5.5,
        fill:"rgba(244,247,245,.09)"},ui);
      const fg = E("rect",{x:66,y:y,width:0,height:11,rx:5.5,fill:"var(--gold)"},ui);
      return fg;
    });
    return (b,p,t)=>{
      const start=[0.455,0.482,0.508,0.535];
      rows.forEach((r,i)=>{
        const u=Math.max(0,Math.min(1,(t-start[i])/0.055));
        A(r,"width",(92*u).toFixed(1));
        A(r,"opacity",(0.35+0.65*u).toFixed(2));
      });
    };
  }

  if(kind === "beats"){
    const dots=[];
    for(let i=0;i<4;i++) dots.push(E("circle",{cx:VW-108+i*26,cy:VH-16,r:5,
      fill:"var(--gold)",opacity:.2},ui));
    const t1 = txt(10,18,"ov-g");
    return (b,p,t)=>{
      const marks=[0.10,0.23,0.36,0.52];
      dots.forEach((d,i)=>{
        const on = t>=marks[i] && t<marks[i]+0.10;
        A(d,"opacity", on?1:.2);
        A(d,"r", on?6.4:5);
        A(d,"fill", i===3?"var(--green)":"var(--gold)");
      });
      t1.textContent = t<0.44 ? "Subida · 3 tiempos" : "Bajada · 1 tiempo";
    };
  }

  if(kind === "balance"){
    const vl = E("line",{stroke:"rgba(201,168,76,.5)","stroke-width":1.3,
      "stroke-dasharray":"4 4",opacity:0},g);
    const t1 = txt(10,18,"ov-g"), t2 = txt(10,33,"ov-t");
    return (b,p,t)=>{
      const h=p(b.head), a=p(b.ankL);
      const on = t>0.80;
      A(vl,"opacity",on?1:0);
      A(vl,"x1",h.x);A(vl,"y1",h.y-14);A(vl,"x2",a.x);A(vl,"y2",a.y+6);
      t1.textContent = "Finish en equilibrio";
      t2.textContent = on ? "Aguanta "+Math.min(3,Math.ceil((t-0.80)*16))+" s" : "";
    };
  }

  if(kind === "profile"){
    const plumb = E("line",{stroke:"var(--gold)","stroke-width":1.4,
      "stroke-dasharray":"4 4"},g);
    const arm = E("line",{stroke:"var(--green)","stroke-width":1.8,
      "stroke-dasharray":"3 3"},g);
    const toe = E("circle",{fill:"var(--gold)",r:3},g);
    const t1 = txt(10,18,"ov-g"), t2 = txt(10,33,"ov-t");
    return (b,p)=>{
      const sh = b.shL, toeW = v3(sh.x, 0, B.pelZ + 13);
      const a = p(v3(sh.x, sh.y, sh.z)), c = p(v3(sh.x, 0, sh.z));
      A(plumb,"x1",a.x);A(plumb,"y1",a.y);A(plumb,"x2",c.x);A(plumb,"y2",c.y);
      const h = p(b.hands);
      A(arm,"x1",a.x);A(arm,"y1",a.y);A(arm,"x2",h.x);A(arm,"y2",h.y);
      const q = p(toeW);
      A(toe,"cx",q.x);A(toe,"cy",q.y);
      const d = Math.round(sh.z - toeW.z);
      t1.textContent = "Perfil: hombros sobre las puntas";
      t2.textContent = Math.abs(d) <= 6 ? "alineado"
        : (d < 0 ? Math.abs(d)+" cm por detrás" : d+" cm por delante");
      A(t1,"fill", Math.abs(d)<=6 ? "var(--green)" : "var(--gold)");
    };
  }

  if(kind === "path"){
    const gate = E("circle",{fill:"none",stroke:"var(--green)","stroke-width":1.8,
      "stroke-dasharray":"3 3"},g);
    const t1 = txt(10,18,"ov-g"), t2 = txt(10,33,"ov-t");
    return (b,p,t)=>{
      const target = buildBody(poseAt(0.20)).chead;
      const q = p(target);
      A(gate,"cx",q.x);A(gate,"cy",q.y);A(gate,"r",9*q.k);
      t1.textContent = "Camino de la cabeza del palo";
      t2.textContent = "Por dentro y hacia arriba";
    };
  }

  if(kind === "hinge"){
    const sp = E("line",{stroke:"var(--gold)","stroke-width":2.4,"stroke-linecap":"round"},g);
    const vl = E("line",{stroke:"rgba(244,247,245,.3)","stroke-width":1.2,
      "stroke-dasharray":"4 4"},g);
    const t1 = txt(10,18,"ov-g"), t2 = txt(10,33,"ov-t");
    return (b,p,t,P)=>{
      const a=p(b.pelvis), c=p(b.head);
      A(sp,"x1",a.x);A(sp,"y1",a.y);A(sp,"x2",c.x);A(sp,"y2",c.y);
      A(vl,"x1",a.x);A(vl,"y1",a.y);A(vl,"x2",a.x);A(vl,"y2",a.y-78);
      t1.textContent = "Bisagra de cadera";
      t2.textContent = Math.round(P.hi) + "° de inclinación";
    };
  }
  return null;
}

/* ===================================================================
   GESTOR DE ESCENAS
   =================================================================== */
let uid = 0;
const scenes = new Map();
const io = ("IntersectionObserver" in window)
  ? new IntersectionObserver(es => es.forEach(e => {
      const s = scenes.get(e.target.id);
      if(s){ s.visible = e.isIntersecting; if(e.isIntersecting) s.dirty = true; }
    }), {rootMargin:"80px"})
  : null;

function mountScenes(root){
  root.querySelectorAll("[data-scene]").forEach(el=>{
    if(el.dataset.mounted) return;
    const def = SCENES[el.dataset.scene];
    if(!def) return;
    el.dataset.mounted = "1";
    const inst = def.create(el);
    inst.speed = 1; inst.paused = REDUCED; inst.t = REDUCED ? (def.still||0.38) : 0;
    inst.visible = !io; inst.dirty = true;
    scenes.set(el.id, inst);
    if(io) io.observe(el);
  });
}

let lastFrame = performance.now();
function tick(now){
  const dt = Math.min(0.05, (now - lastFrame)/1000);
  lastFrame = now;
  scenes.forEach((s,id)=>{
    if(!s.host.isConnected){ scenes.delete(id); return; }
    if(!s.visible) return;

  let a = dir, x = bx, y = by;

    const r = a*RAD;
    x += Math.sin(r)*segs[i];
    y -= Math.cos(r)*segs[i];
    pts.push([x,y]);

const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function md(src){
  const lines = esc(String(src||"").trim()).split(/\r?\n/);
  let out="", inList=false;
  const inline = t => t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/(^|\s)\*([^*\n]+)\*/g,"$1<i>$2</i>");
  for(const raw of lines){
    const line = raw.trim();
    if(/^[-*•]\s+/.test(line) || /^\d+[.)]\s+/.test(line)){
      if(!inList){ out+="<ul>"; inList=true; }
      out += "<li>"+inline(line.replace(/^([-*•]|\d+[.)])\s+/,""))+"</li>";
      continue;
    }
    if(inList){ out+="</ul>"; inList=false; }
    if(!line) continue;
    if(/^#{1,4}\s+/.test(line)){ out += "<p><b>"+inline(line.replace(/^#{1,4}\s+/,""))+"</b></p>"; continue; }
    out += "<p>"+inline(line)+"</p>";
  }
  if(inList) out+="</ul>";
  return out || "<p></p>";
}

/* ============ API ============ */
class ApiError extends Error{}
async function callClaude({system, messages, maxTokens}){
  const key = getKey();
  if(!key) throw new ApiError("NO_KEY");
  let res;
  try{
    res = await fetch(API_URL,{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,
        "anthropic-version":API_VERSION,
        "anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({model:getModel(), max_tokens:maxTokens||1600, system, messages})
    });
  }catch(e){
    throw new ApiError("No se pudo conectar con la API. Revisa la conexión y que tu clave permita llamadas desde el navegador.");
  }
  if(!res.ok){
    let d="";
    try{ const j=await res.json(); d=(j.error&&j.error.message)||JSON.stringify(j).slice(0,220); }
    catch(e){ d=(await res.text()).slice(0,220); }
    if(res.status===401) throw new ApiError("Clave API no válida (401). Revísala en Ajustes.");
    if(res.status===429) throw new ApiError("Límite de peticiones (429). Espera unos segundos.");
    if(res.status===413) throw new ApiError("El vídeo generó imágenes demasiado grandes. Graba un clip más corto.");
    throw new ApiError("Error "+res.status+": "+d);
  }
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  return text || "(El coach no devolvió texto. Reintenta.)";
}

/* ============ VÍDEO → FOTOGRAMAS ============ */
function loadVideo(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    v.preload="auto"; v.muted=true; v.playsInline=true;
    v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline","");
    const to = setTimeout(()=>{ URL.revokeObjectURL(url); reject(new Error("tiempo agotado al abrir el vídeo")); },15000);
    v.addEventListener("error",()=>{ clearTimeout(to); URL.revokeObjectURL(url); reject(new Error("formato no soportado")); });
    v.addEventListener("loadeddata",()=>{ clearTimeout(to); resolve({v,url}); },{once:true});
    v.src = url; v.load();
  });
}
function seekTo(v,t){
  return new Promise(resolve=>{
    let done=false;
    const fin=()=>{ if(done) return; done=true; resolve(); };
    const to=setTimeout(fin,2500);
    v.addEventListener("seeked",()=>{ clearTimeout(to); fin(); },{once:true});
    try{ v.currentTime = t; }catch(e){ clearTimeout(to); fin(); }
  });
}
async function extractFrames(file,n){
  n = n || FRAMES_PER_CLIP;
  const {v,url} = await loadVideo(file);
  const cv = $("#grabCanvas"), ctx = cv.getContext("2d");
  const out = [];
  try{
    const dur = isFinite(v.duration) && v.duration>0 ? v.duration : 1;
    const vw = v.videoWidth, vh = v.videoHeight;
    if(!vw || !vh) throw new Error("el vídeo no expone dimensiones");
    const scale = Math.min(1, 620/Math.max(vw,vh));
    cv.width = Math.round(vw*scale); cv.height = Math.round(vh*scale);
    for(let i=0;i<n;i++){
      const t = Math.min(dur-0.05, dur*(i+0.5)/n);
      if(t > 0.02) await seekTo(v,t);
      ctx.drawImage(v,0,0,cv.width,cv.height);
      const du = cv.toDataURL("image/jpeg",0.74);
      out.push({dataUrl:du, b64:du.split(",")[1], mime:"image/jpeg"});
    }
  } finally { v.src=""; URL.revokeObjectURL(url); }
  if(!out.length) throw new Error("no se pudo extraer ningún fotograma");
  return out;
}

El alumno lleva varios años practicando pero arrastra errores persistentes, lo que indica hábitos motores arraigados: no basta con explicarle la teoría, hay que darle una sensación concreta y un drill.

Lección actual: ${topic}.

- Termina siempre con un drill concreto: nombre, repeticiones y la sensación que debe buscar.

function drillSystem(lesson, drill, n){
  return `Eres un instructor de golf certificado PGA con 20 años de experiencia. Respondes SIEMPRE en español de España.

Recibes ${n} FOTOGRAMAS extraídos en orden cronológico de un vídeo corto que el alumno acaba de grabar. Tu único trabajo es decidir si está ejecutando BIEN ESTE EJERCICIO CONCRETO, nada más.

Ejercicio: "${drill.name}" (${drill.reps})
Lección: ${lesson.title}
Instrucción que se le dio: ${drill.cue.replace(/\*\*/g,"")}
Puntos de control que debes verificar: ${drill.check}
Errores típicos de esta fase: ${lesson.common_mistakes.join("; ")}
El alumno es ${getHand()}.

Reglas innegociables:
- Juzga SOLO lo que se ve en los fotogramas. Si el encuadre, la distancia o el desenfoque no permiten verificar un punto de control, dilo explícitamente en vez de suponerlo.
- Los fotogramas son instantes sueltos, no vídeo continuo: no afirmes nada sobre velocidad, ritmo ni secuencia temporal salvo que la diferencia entre fotogramas lo demuestre.
- NUNCA inventes datos de vuelo de bola, velocidad, spin ni ángulos medidos.
- No cambies de ejercicio ni metas correcciones de otras fases del swing. Si ves algo grave fuera de alcance, menciónalo en una sola frase al final de "Qué veo".
- El alumno lleva años practicando: asume hábitos arraigados y sé directo.

Devuelve EXACTAMENTE estas cuatro secciones con estos encabezados literales:

## Veredicto
Una sola línea que empiece por una de estas tres palabras exactas: CORRECTO, CASI o CORREGIR. Después, dos puntos y un resumen de máximo 12 palabras.

## Qué veo
Punto de control por punto de control, con guiones: di si se cumple, no se cumple o no se puede verificar, y en qué fotograma lo ves.

## Corrección
UNA sola corrección, la más importante. Si el veredicto es CORRECTO, escribe qué afinar para subir el nivel.

## Cómo repetirlo

const ANALYZER_SYSTEM = `Eres un instructor de golf certificado PGA con 20 años de experiencia analizando swings de golfistas intermedios. Respondes SIEMPRE en español de España.

Recibes varios FOTOGRAMAS en orden cronológico extraídos de un vídeo del swing del alumno, más su descripción escrita.

Reglas innegociables:

- El alumno tiene años de práctica: prioriza el error que esté más abajo en la cadena causal.

Devuelve EXACTAMENTE estas tres secciones con estos encabezados literales:

## Lo que se ve bien
## Errores clave
## Drill para corregirlo`;

const analyzerPrefill = () =>
`Palo usado: \nVuelo de bola habitual con este palo: \nQué siento durante el swing: \nQué llevo años intentando corregir sin éxito: \nMi hándicap aproximado: `;

/* ============ RENDER DE FEEDBACK ============ */
const FB_DEFS = [
  {re:/lo que se ve bien/i, cls:"ok",   icon:"✅"},
  {re:/errores? clave/i,    cls:"warn", icon:"⚠️"},
  {re:/qu[eé] veo/i,        cls:"info", icon:"👁"},
  {re:/correcci[oó]n/i,     cls:"warn", icon:"⚠️"},
  {re:/c[oó]mo repetirlo/i, cls:"fix",  icon:"🔁"},
  {re:/drill/i,             cls:"fix",  icon:"🎯"}
];
function renderFeedback(text){
  const parts = String(text).split(/^\s*#{1,4}\s*/m).map(s=>s.trim()).filter(Boolean);
  let html="", matched=0;
  for(const p of parts){
    const nl = p.indexOf("\n");
    const head = (nl===-1?p:p.slice(0,nl)).trim();
    const body = (nl===-1?"":p.slice(nl+1)).trim();
    if(/veredicto/i.test(head)){
      const v = body.toUpperCase();
      const cls = /^CORRECTO/.test(v) ? "v-ok" : /^CASI/.test(v) ? "v-mid" : "v-bad";
      html += `<div class="verdict ${cls}"><span class="vdot"></span><span>${esc(body)}</span></div>`;
      matched++; continue;
    }
    const def = FB_DEFS.find(d=>d.re.test(head));
    if(def && body){
      html += `<div class="fb-sec ${def.cls}"><h4>${def.icon} ${esc(head)}</h4><div class="body">${md(body)}</div></div>`;
      matched++;
    }
  }
  if(!matched) return `<div class="fb-sec fix"><h4>🎯 Análisis del coach</h4><div class="body">${md(text)}</div></div>`;
  return html;
}

function drillCheckBlock(lesson, drill, key){
  drillRef.set(key,{lesson,drill});
  return `<div class="dcheck" id="dc-${key}">

function runDrillCheck(key, src){
  const ref = drillRef.get(key);
  const box = $("#dc-"+key);
  if(!ref || !box) return;
  if(!getKey()){ openSettings(true); return; }
  const out = $(".dc-out", box);
  pickVideo(src, async file=>{
    out.innerHTML = `<div class="note" style="margin-top:10px">Extrayendo fotogramas…</div>`;
    let fr;
    try{ fr = await extractFrames(file); }
    catch(err){
      out.innerHTML = `<div class="err" style="margin-top:10px">No se pudo leer el vídeo (${esc(err.message||"error")}). Prueba con un clip más corto o en formato estándar.</div>`;
      return;
    }
    const strip = `<div class="strip">${fr.map((f,i)=>`<img src="${f.dataUrl}" alt="Fotograma ${i+1}">`).join("")}</div>`;
    out.innerHTML = strip + `<div class="note" style="margin-top:10px"><span class="typing" style="display:inline-flex;vertical-align:middle;margin-right:8px"><i></i><i></i><i></i></span>El coach está revisando tu ejecución.</div>`;
    const content = fr.map(f=>({type:"image",source:{type:"base64",media_type:f.mime,data:f.b64}}));
    content.push({type:"text", text:
`Estos son ${fr.length} fotogramas en orden cronológico de mi ejecución del ejercicio "${ref.drill.name}".
Dime si lo estoy haciendo bien según los puntos de control, con las cuatro secciones indicadas.`});
    try{
      const reply = await callClaude({system: drillSystem(ref.lesson, ref.drill, fr.length),
        messages:[{role:"user", content}], maxTokens:1500});
      out.innerHTML = strip + renderFeedback(reply);
    }catch(e){
      out.innerHTML = strip + `<div class="err" style="margin-top:10px">${esc(
        e.message==="NO_KEY" ? "Falta la clave API. Ábrela en Ajustes." : e.message)}</div>`;
    }
  });
}

      : `<div class="msg a"><div>${md(m.content)}</div></div>`).join("");

async function sendChat(){
  const text = chatInput.value.trim();
  if(!text || chatBusy) return;
  if(!getKey()){ openSettings(true); return; }
  const h = getHistory();
  h.push({role:"user", content:text}); saveHistory(h);
  chatInput.value=""; chatInput.style.height="auto";
  paintChat();
  chatBusy = true; $("#chatSend").disabled = true;
  chatLog.insertAdjacentHTML("beforeend",
    `<div class="msg a" id="typing"><div><div class="typing"><i></i><i></i><i></i></div></div></div>`);
  chatLog.scrollTop = chatLog.scrollHeight;
  try{
    const reply = await callClaude({system: coachSystem(chatLesson),
      messages: h.map(m=>({role:m.role, content:m.content})), maxTokens:1200});
    const h2 = getHistory(); h2.push({role:"assistant", content:reply}); saveHistory(h2);
    paintChat();
  }catch(e){
    const el = $("#typing");
    const msg = e.message==="NO_KEY" ? "Falta la clave API. Ábrela en el icono de ajustes." : e.message;
    if(el) el.outerHTML = `<div class="msg a"><div class="err" style="border-radius:8px">${esc(msg)}</div></div>`;
    chatLog.scrollTop = chatLog.scrollHeight;

    chatBusy = false; $("#chatSend").disabled = false;

    setDone(id, !isDone(id));
    comp.className = "btn" + (isDone(id)?" btn-done":"");
    comp.innerHTML = isDone(id) ? ICON.check+" Lección completada" : "Marcar como completada";
    return;
  }
  const play = e.target.closest("[data-play]");
  if(play){
    const s = scenes.get(play.dataset.play);
    if(s){ s.paused = !s.paused; s.dirty = true;
      play.textContent = s.paused ? "▶ Play" : "⏸ Pausa"; }
    return;
  }
  const spd = e.target.closest("[data-spd]");
  if(spd){
    const order = ["0.5","1","2"];
    const next = order[(order.indexOf(spd.dataset.v)+1)%order.length];
    spd.dataset.v = next;
    spd.textContent = next.replace(".",",")+"×";
    const s = scenes.get(spd.dataset.spd);
    if(s) s.speed = parseFloat(next);
    return;
  }
});
$("#btnBack").addEventListener("click", closeLesson);
$("#fab").addEventListener("click",()=>openChat(LESSONS.find(l=>l.id===openLessonId)||null));
$("#chatClose").addEventListener("click", closeChat);
$("#chatClear").addEventListener("click",()=>{
  if(!confirm("¿Borrar esta conversación?")) return;
  store.del(chatKey()); paintChat();
});
$("#chatSend").addEventListener("click", sendChat);
chatInput.addEventListener("input",()=>{
  chatInput.style.height="auto";
  chatInput.style.height=Math.min(chatInput.scrollHeight,110)+"px";
});
chatInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); sendChat(); }
});

}
